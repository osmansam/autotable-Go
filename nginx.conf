events {
    worker_connections 1024;
}

http {
    # Temporary headroom for migrating legacy root-scoped JWT cookies. New
    # project cookies are path-scoped and no longer accumulate per request.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    # One bounded service budget, independent of client-supplied identities.
    limit_req_zone $server_name zone=ozmishow_gateway:1m rate=200r/s;
    limit_conn_zone $server_name zone=ozmishow_connections:1m;

    upstream app {
        server app:4000;
    }

    server {
        listen 80;
        server_name api-production.autoapi.org;

        # Increase body size for file uploads
        client_max_body_size 50M;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location = /internal/ozmishow/rate-limit {
            client_max_body_size 1k;
            client_body_timeout 3s;
            limit_req zone=ozmishow_gateway burst=40 nodelay;
            limit_req_status 429;
            limit_conn ozmishow_connections 32;
            limit_conn_status 503;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Fiber normally matches case/trailing-slash variants. Reject the
        # entire noncanonical namespace before its body reaches the API.
        location ~* ^/internal/ozmishow(?:/|$) {
            return 404;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # WebSocket support
        location /ws {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
