name: Verify AutoTable

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Lint, coverage, tooling and vulnerability gates
        run: make check
      - name: Preserve quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            build/coverage.out
            build/staticcheck.json
          if-no-files-found: warn
      - name: Build production binary
        run: make build

  mongo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name autotable-ci-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet ci --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec autotable-ci-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'; then break; fi
            sleep 1
          done
          docker exec autotable-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"ci",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 60); do
            if docker exec autotable-ci-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Mongo authorization, workflow and session integration tests
        env:
          AUTOTABLE_WORKFLOW_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=ci
          AUTOTABLE_COLLABORATION_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=ci
        run: go test -race -tags=integration ./... -count=1 -v
      - name: Stop isolated MongoDB
        if: always()
        run: docker rm -f autotable-ci-mongo

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned production image
        run: docker build --platform linux/amd64 -t autotable:security-ci .
      - name: Verify non-root runtime permissions without starting the service
        run: |
          docker run --rm --entrypoint /bin/sh autotable:security-ci -ec '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test -w /app/temp
            test -w /app/logs
            test -x /app/server
            test ! -w /app/server
            test -r /app/configs/production.json
            test ! -w /app/configs/production.json
            touch /app/temp/ci-probe /app/logs/ci-probe
          '
