name: Deploy to Digital Ocean

on:
  push:
    branches: ["main"] # Verify pushes; production deploy is manual-only
  workflow_dispatch: # Allow manual deployment

permissions:
  contents: read

concurrency:
  group: autotable-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    # Pushes verify only; production releases require an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Create .env file
        env:
          DEPLOY_PORT_NUMBER: ${{ secrets.PORT_NUMBER }}
          DEPLOY_MONGO_URI_BASE: ${{ secrets.MONGO_URI_BASE }}
          DEPLOY_COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }}
          DEPLOY_MONGO_URI_SUFFIX: ${{ secrets.MONGO_URI_SUFFIX }}
          DEPLOY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_CONTAINER_JWT_SECRET: ${{ secrets.CONTAINER_JWT_SECRET }}
          DEPLOY_CLOUD_NAME: ${{ secrets.CLOUD_NAME }}
          DEPLOY_CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          DEPLOY_CLOUD_API_SECRET: ${{ secrets.CLOUD_API_SECRET }}
          DEPLOY_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          DEPLOY_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEPLOY_GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          DEPLOY_BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          DEPLOY_FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DEPLOY_TENANT_JWT_SECRET: ${{ secrets.TENANT_JWT_SECRET }}
          DEPLOY_OBSERVABILITY_TOKEN: ${{ secrets.OBSERVABILITY_TOKEN }}
          DEPLOY_EXTERNAL_API_CREDENTIAL_KEY: ${{ secrets.EXTERNAL_API_CREDENTIAL_KEY }}
          DEPLOY_COLLABORATION_MEMBERS_ENABLED: ${{ secrets.COLLABORATION_MEMBERS_ENABLED }}
          DEPLOY_COLLABORATION_INVITATIONS_ENABLED: ${{ secrets.COLLABORATION_INVITATIONS_ENABLED }}
          DEPLOY_COLLABORATION_RECOVERY_ENABLED: ${{ secrets.COLLABORATION_RECOVERY_ENABLED }}
          DEPLOY_INVITATION_SMTP_HOST: ${{ secrets.INVITATION_SMTP_HOST }}
          DEPLOY_INVITATION_SMTP_PORT: ${{ secrets.INVITATION_SMTP_PORT }}
          DEPLOY_INVITATION_SMTP_TLS_MODE: ${{ secrets.INVITATION_SMTP_TLS_MODE }}
          DEPLOY_INVITATION_SMTP_FROM: ${{ secrets.INVITATION_SMTP_FROM }}
          DEPLOY_INVITATION_SMTP_USERNAME: ${{ secrets.INVITATION_SMTP_USERNAME }}
          DEPLOY_INVITATION_SMTP_PASSWORD: ${{ secrets.INVITATION_SMTP_PASSWORD }}
          DEPLOY_INVITATION_PANEL_URL: ${{ secrets.INVITATION_PANEL_URL }}
          DEPLOY_INVITATION_DELIVERY_KEYS_JSON: ${{ secrets.INVITATION_DELIVERY_KEYS_JSON }}
          DEPLOY_INVITATION_DELIVERY_ACTIVE_KEY_ID: ${{ secrets.INVITATION_DELIVERY_ACTIVE_KEY_ID }}
          DEPLOY_OZMISHOW_SERVICE_SECRET: ${{ secrets.OZMISHOW_RATE_LIMIT_SERVICE_SECRET }}
          DEPLOY_OZMISHOW_PREVIOUS_SECRET: ${{ secrets.OZMISHOW_RATE_LIMIT_PREVIOUS_SECRET }}
          DEPLOY_OZMISHOW_REDIS_PASSWORD: ${{ secrets.OZMISHOW_RATE_LIMIT_REDIS_PASSWORD }}
        run: |
          umask 077
          test -n "$DEPLOY_JWT_SECRET"
          test -n "$DEPLOY_TENANT_JWT_SECRET"
          test "$DEPLOY_JWT_SECRET" != "$DEPLOY_TENANT_JWT_SECRET"
          if [ -z "$DEPLOY_EXTERNAL_API_CREDENTIAL_KEY" ]; then
            echo 'Missing EXTERNAL_API_CREDENTIAL_KEY repository secret for external API credential encryption.' >&2
            exit 1
          fi
          DEPLOY_COMPOSE_FILE=docker-compose.yml
          for deployed_secret in "$DEPLOY_OZMISHOW_SERVICE_SECRET" "$DEPLOY_OZMISHOW_PREVIOUS_SECRET" "$DEPLOY_OZMISHOW_REDIS_PASSWORD"; do
            if [[ -n "$deployed_secret" && ( ${#deployed_secret} -lt 32 || ${#deployed_secret} -gt 512 || ! "$deployed_secret" =~ ^[a-zA-Z0-9_+/=-]+$ ) ]]; then
              echo 'Ozmishow credentials must be 32-512 environment-file-safe characters; generated hex is recommended.' >&2
              exit 1
            fi
          done
          if [ -n "$DEPLOY_OZMISHOW_SERVICE_SECRET" ]; then
            if [ "${#DEPLOY_OZMISHOW_SERVICE_SECRET}" -lt 32 ] || [ "${#DEPLOY_OZMISHOW_REDIS_PASSWORD}" -lt 32 ] || [ "$DEPLOY_OZMISHOW_SERVICE_SECRET" = "$DEPLOY_OZMISHOW_REDIS_PASSWORD" ]; then
              echo 'Ozmishow requires separate service and Redis secrets of at least 32 characters.' >&2
              exit 1
            fi
            DEPLOY_COMPOSE_FILE=docker-compose.yml:docker-compose.ozmishow.yml
          fi
          cat > .env << EOF
          PORT_NUMBER=$DEPLOY_PORT_NUMBER
          MONGO_URI_BASE=$DEPLOY_MONGO_URI_BASE
          COLLECTION_NAME=$DEPLOY_COLLECTION_NAME
          MONGO_URI_SUFFIX=$DEPLOY_MONGO_URI_SUFFIX
          JWT_SECRET=$DEPLOY_JWT_SECRET
          CONTAINER_JWT_SECRET=$DEPLOY_CONTAINER_JWT_SECRET
          CLOUD_NAME=$DEPLOY_CLOUD_NAME
          CLOUD_API_KEY=$DEPLOY_CLOUD_API_KEY
          CLOUD_API_SECRET=$DEPLOY_CLOUD_API_SECRET
          GOOGLE_CLIENT_ID=$DEPLOY_GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$DEPLOY_GOOGLE_CLIENT_SECRET
          GOOGLE_REDIRECT_URL=$DEPLOY_GOOGLE_REDIRECT_URL
          BACKEND_BASE_URL=$DEPLOY_BACKEND_BASE_URL
          FRONTEND_URL=$DEPLOY_FRONTEND_URL
          TENANT_JWT_SECRET=$DEPLOY_TENANT_JWT_SECRET
          EXTERNAL_API_CREDENTIAL_KEY=$DEPLOY_EXTERNAL_API_CREDENTIAL_KEY
          NODE_ENV=production
          COMPOSE_FILE=$DEPLOY_COMPOSE_FILE
          OZMISHOW_RATE_LIMIT_SERVICE_SECRET=$DEPLOY_OZMISHOW_SERVICE_SECRET
          OZMISHOW_RATE_LIMIT_PREVIOUS_SECRET=$DEPLOY_OZMISHOW_PREVIOUS_SECRET
          OZMISHOW_RATE_LIMIT_REDIS_PASSWORD=$DEPLOY_OZMISHOW_REDIS_PASSWORD
          EOF
          # Quote collaboration values for Compose; retain JSON, passwords and
          # literal dollar signs without expanding them in the shell or Compose.
          python3 - <<'PY'
          import json
          import os
          import sys

          keys = (
              "OBSERVABILITY_TOKEN",
              "COLLABORATION_MEMBERS_ENABLED", "COLLABORATION_INVITATIONS_ENABLED", "COLLABORATION_RECOVERY_ENABLED",
              "INVITATION_SMTP_HOST", "INVITATION_SMTP_PORT", "INVITATION_SMTP_TLS_MODE", "INVITATION_SMTP_FROM",
              "INVITATION_SMTP_USERNAME", "INVITATION_SMTP_PASSWORD", "INVITATION_PANEL_URL",
              "INVITATION_DELIVERY_KEYS_JSON", "INVITATION_DELIVERY_ACTIVE_KEY_ID",
          )
          lines = []
          for key in keys:
              value = os.environ.get("DEPLOY_" + key, "")
              if key.startswith("COLLABORATION_") and not value:
                  value = "false"
              if "\n" in value or "\r" in value:
                  sys.exit(key + " must be a single-line repository secret")
              quoted = json.dumps(value, ensure_ascii=False).replace("$", "$$")
              lines.append(key + "=" + quoted + "\n")
          with open(".env", "a", encoding="utf-8") as target:
              target.writelines(lines)
          PY
          chmod 600 .env

      - name: Deploy to Digital Ocean
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Create app directory on server if it doesn't exist
          ssh -i ~/.ssh/id_rsa $SSH_USER@$DROPLET_IP "mkdir -p ~/autotable"

          # Copy files to server
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.next' \
            --exclude='.deploy' \
            --exclude='observability/secrets/' \
            --exclude='loadtest' \
            --exclude='temp' \
            --exclude='logs' \
            ./ $SSH_USER@$DROPLET_IP:~/autotable/

          # Stage secrets separately; the current release keeps its environment
          # until its replacement has built successfully.
          scp -i ~/.ssh/id_rsa .env "$SSH_USER@$DROPLET_IP:autotable/.env.next"
          ssh -i ~/.ssh/id_rsa "$SSH_USER@$DROPLET_IP" \
            "cd ~/autotable && AUTOTABLE_RELEASE_TAG=${{ github.sha }} bash scripts/deploy-production.sh"
