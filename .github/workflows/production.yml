name: Deploy to Digital Ocean

on:
  push:
    branches: ["main"] # Deploy when pushing to main branch
  workflow_dispatch: # Allow manual deployment

permissions:
  contents: read

concurrency:
  group: autotable-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Create .env file
        env:
          DEPLOY_PORT_NUMBER: ${{ secrets.PORT_NUMBER }}
          DEPLOY_MONGO_URI_BASE: ${{ secrets.MONGO_URI_BASE }}
          DEPLOY_COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }}
          DEPLOY_MONGO_URI_SUFFIX: ${{ secrets.MONGO_URI_SUFFIX }}
          DEPLOY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_CONTAINER_JWT_SECRET: ${{ secrets.CONTAINER_JWT_SECRET }}
          DEPLOY_CLOUD_NAME: ${{ secrets.CLOUD_NAME }}
          DEPLOY_CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          DEPLOY_CLOUD_API_SECRET: ${{ secrets.CLOUD_API_SECRET }}
          DEPLOY_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          DEPLOY_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DEPLOY_GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          DEPLOY_BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          DEPLOY_FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DEPLOY_TENANT_JWT_SECRET: ${{ secrets.TENANT_JWT_SECRET }}
          DEPLOY_EXTERNAL_API_CREDENTIAL_KEY: ${{ secrets.EXTERNAL_API_CREDENTIAL_KEY }}
        run: |
          umask 077
          test -n "$DEPLOY_JWT_SECRET"
          test -n "$DEPLOY_TENANT_JWT_SECRET"
          test "$DEPLOY_JWT_SECRET" != "$DEPLOY_TENANT_JWT_SECRET"
          if [ -z "$DEPLOY_EXTERNAL_API_CREDENTIAL_KEY" ]; then
            echo 'Missing EXTERNAL_API_CREDENTIAL_KEY repository secret for external API credential encryption.' >&2
            exit 1
          fi
          cat > .env << EOF
          PORT_NUMBER=$DEPLOY_PORT_NUMBER
          MONGO_URI_BASE=$DEPLOY_MONGO_URI_BASE
          COLLECTION_NAME=$DEPLOY_COLLECTION_NAME
          MONGO_URI_SUFFIX=$DEPLOY_MONGO_URI_SUFFIX
          JWT_SECRET=$DEPLOY_JWT_SECRET
          CONTAINER_JWT_SECRET=$DEPLOY_CONTAINER_JWT_SECRET
          CLOUD_NAME=$DEPLOY_CLOUD_NAME
          CLOUD_API_KEY=$DEPLOY_CLOUD_API_KEY
          CLOUD_API_SECRET=$DEPLOY_CLOUD_API_SECRET
          GOOGLE_CLIENT_ID=$DEPLOY_GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$DEPLOY_GOOGLE_CLIENT_SECRET
          GOOGLE_REDIRECT_URL=$DEPLOY_GOOGLE_REDIRECT_URL
          BACKEND_BASE_URL=$DEPLOY_BACKEND_BASE_URL
          FRONTEND_URL=$DEPLOY_FRONTEND_URL
          TENANT_JWT_SECRET=$DEPLOY_TENANT_JWT_SECRET
          EXTERNAL_API_CREDENTIAL_KEY=$DEPLOY_EXTERNAL_API_CREDENTIAL_KEY
          NODE_ENV=production
          EOF
          chmod 600 .env

      - name: Deploy to Digital Ocean
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Create app directory on server if it doesn't exist
          ssh -i ~/.ssh/id_rsa $SSH_USER@$DROPLET_IP "mkdir -p ~/autotable"

          # Copy files to server
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.next' \
            --exclude='.deploy' \
            --exclude='loadtest' \
            --exclude='temp' \
            --exclude='logs' \
            ./ $SSH_USER@$DROPLET_IP:~/autotable/

          # Stage secrets separately; the current release keeps its environment
          # until its replacement has built successfully.
          scp -i ~/.ssh/id_rsa .env "$SSH_USER@$DROPLET_IP:autotable/.env.next"
          ssh -i ~/.ssh/id_rsa "$SSH_USER@$DROPLET_IP" \
            "cd ~/autotable && AUTOTABLE_RELEASE_TAG=${{ github.sha }} bash scripts/deploy-production.sh"
